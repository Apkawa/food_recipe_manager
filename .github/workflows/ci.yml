name: CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - '**'
    tags:
      - 'v*'


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run unit tests
        run: pnpm run test
        # TODO надо подумать над обходом cloudflare
#      - name: Run e2e tests
#        run: pnpm run test:e2e

      - name: Run lint
        run: pnpm run lint

  publish:
    permissions:
      contents: write
    needs:
      - test
    runs-on: ubuntu-latest
    if: contains('
      refs/heads/dev
      refs/heads/master
      ', github.ref) || startsWith(github.ref, 'refs/tags')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Extract branch name
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Extract tag name
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        id: extract_tag

      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Check env
        run: |
          echo $RELEASE_VERSION
          echo ${{ steps.extract_tag.outputs.tag }}
          echo ${{ steps.extract_branch.outputs.branch }}

      # Если мастер - деплоим в корень
      - name: Set target folder
        uses: haya14busa/action-cond@v1
        id: target_folder
        if: success()
        with:
          cond: ${{ startsWith(github.ref, 'refs/tags') }}
          if_true: "release"
          if_false: ${{ steps.extract_branch.outputs.branch }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          echo $DOWNLOAD_SUFFIX
          export DOWNLOAD_SUFFIX=$DOWNLOAD_SUFFIX
          pnpm run build
        env:
          DOWNLOAD_SUFFIX: '/raw/release/${{ steps.target_folder.outputs.value }}/'

      - name: Deploy to release branch
        if: success()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/web-react/dist # The folder the action should deploy.
          clean: true # Automatically remove deleted files from the deploy branch
          target-folder: ${{ steps.target_folder.outputs.value }}
